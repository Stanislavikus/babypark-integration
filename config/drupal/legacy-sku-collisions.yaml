version: 1
# Reviewed Drupal legacy SKU collision overrides for the read-only exporter.
#
# Supported actions (D2a parser):
#
# exclude_product — cross-product sku_key collision between exactly two products:
#   - sku_key
#   - action: exclude_product
#   - retain_native_product_id
#   - exclude_native_product_id
#   - reviewed_source: "review:<identifier>"
#   - reason
#
# exclude_variant — within-product duplicate sku_key between two structural variants:
#   - sku_key
#   - action: exclude_variant
#   - native_product_id
#   - retain_native_variant_id
#   - exclude_native_variant_id
#   - reviewed_source: "review:<identifier>"
#   - reason
#
# This file remains intentionally empty until human review of exporter collision-report.json.
# No collision is approved merely because it exists in Drupal source data.
mappings: []
