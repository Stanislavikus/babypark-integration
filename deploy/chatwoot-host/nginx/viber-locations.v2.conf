# BabyPark Viber gateway v2 cutover target.
# Replace the two existing 3101 proxy_pass targets only after v2 health passes.

location = /api/chatwoot/viber {
    proxy_pass http://127.0.0.1:3102/api/chatwoot/viber;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 15s;
    access_log /var/log/nginx/babypark_chatwoot_viber_access.log;
    error_log /var/log/nginx/babypark_chatwoot_viber_error.log;
}

location = /api/viber/webhook {
    proxy_pass http://127.0.0.1:3102/api/viber/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 15s;
    access_log /var/log/nginx/babypark_viber_access.log;
    error_log /var/log/nginx/babypark_viber_error.log;
}
