name: babypark-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:9a83f64039070a846723cdf7d95b85db9ad1e6fadb38cad1ca12eceb04e04f33
    init: true
    user: "1000:1000"
    networks:
      - n8n_private
    ports:
      - target: 5678
        published: "5678"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: /var/lib/babypark-n8n/user
        target: /home/node/.n8n
        bind:
          create_host_path: false
      - type: bind
        source: /run/babypark-n8n-runtime
        target: /vol
        bind:
          create_host_path: false
    environment:
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Load N8N_ENCRYPTION_KEY from /etc/babypark-n8n/n8n.env}
      N8N_HOST: 127.0.0.1
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_EXECUTION_DATA_STORAGE_MODE: filesystem
      N8N_STORAGE_PATH: /vol/storage
      N8N_EVENTBUS_LOGWRITER_LOGFULLPATH: /vol/events/n8nEventLog.log
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  n8n_private:
    internal: true
