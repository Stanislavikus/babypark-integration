name: babypark-n8n

services:
  postgres:
    image: postgres:16.16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
    init: true
    networks:
      - n8n_private
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Load POSTGRES_PASSWORD from /etc/babypark-n8n/n8n.env}
    volumes:
      - type: bind
        source: /var/lib/babypark-n8n/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:9a83f64039070a846723cdf7d95b85db9ad1e6fadb38cad1ca12eceb04e04f33
    init: true
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n_private
    ports:
      - target: 5678
        published: "5678"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: /var/lib/babypark-n8n/user
        target: /home/node/.n8n
        bind:
          create_host_path: false
      - type: bind
        source: /run/babypark-n8n-runtime
        target: /vol
        bind:
          create_host_path: false
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Load POSTGRES_PASSWORD from /etc/babypark-n8n/n8n.env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Load N8N_ENCRYPTION_KEY from /etc/babypark-n8n/n8n.env}
      N8N_HOST: 127.0.0.1
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_EXECUTION_DATA_STORAGE_MODE: filesystem
      N8N_STORAGE_PATH: /vol/storage
      N8N_EVENTBUS_LOGWRITER_LOGFULLPATH: /vol/events/n8nEventLog.log
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  n8n_private:
    internal: true
